version: '3.8'

services:
  # 1. The Node.js / React Frontend (What we are running now)
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PYTHON_BACKEND_URL=http://api:8000
    depends_on:
      - api

  # 2. The Python FastAPI Gateway
  api:
    build: ./python-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis

  # 3. The Message Broker for task queuing
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # 4. The GPU Worker (Runs PyTorch and AutoDock Vina)
  gpu-worker:
    build: ./python-backend
    command: celery -A worker.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
